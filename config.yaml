# ==========================================================
#  KETHERBAR - YASB theme
#  Designed & built by Kenzzy (Krishna Upadhyay)
# ==========================================================
watch_stylesheet: true
watch_config: true
debug: false
komorebi:
  start_command: "komorebic start --whkd"
  stop_command: "komorebic stop --whkd"
  reload_command: "komorebic reload-configuration"
bars:
  status-bar:
    enabled: true
    screens: ['*']
    class_name: "yasb-bar"
    alignment:
      position: "top"
    blur_effect:
      enabled: true
      dark_mode: true
      round_corners: false
      border_color: "System"
    window_flags:
      always_on_top: true
      windows_app_bar: true
      hide_on_fullscreen: true
      auto_hide: false
    dimensions:
      width: "100%"
      height: 25
    widgets:
      left:
        [
          "home",
          #"active_window",
          "apps"
        ]
      center: [
         #"clock", "weather"
        ]
      right:
        [
          "systray",
          "quick_launch",
          "media",
          "microphone",
          #"volume",
          #"brightness",
          "wifi",
          "bluetooth",
          "battery",
          #"traffic",
          "weather",
          "clock",
          #"settings",
          #"notifications",
          #"power_menu"
        ]
widgets:
  microphone:
    type: "yasb.microphone.MicrophoneWidget"
    options:
      label: "<span>{icon}</span>"
      label_alt: "<span>{icon}</span> {level}"
      mute_text: "mute"
      icons:
        normal: "\ued03"
        muted: "\uefc6"
      mic_menu:
        blur: true
        round_corners: true
        round_corners_type: "normal"
        border_color: "system"
        alignment: "right"
        direction: "down"
      callbacks:
        on_left: "toggle_mute"
        on_middle: "toggle_label"
        on_right: "toggle_mic_menu"
  media:
    type: "yasb.media.MediaWidget"
    options:
      # Compact Now Playing: a single button in the bar; details stay in the flyout.
      label: "\uf01d"
      label_alt: "{title} - {artist}"
      max_field_size:
        label: 1
        label_alt: 30
      show_thumbnail: false
      controls_only: false
      controls_left: false
      controls_hide: true
      thumbnail_alpha: 100
      thumbnail_padding: 0
      thumbnail_corner_radius: 0
      hide_empty: true
      callbacks:
        # Left-click toggles playback, right-click opens the media flyout.
        on_left: "toggle_play_pause"
        on_middle: "do_nothing"
        on_right: "toggle_media_menu"
      icons:
        prev_track: "\ue892"
        next_track: "\ue893"
        play: "\uf01d"
        pause: "\uf28c"
      media_menu:
        blur: true
        round_corners: true
        round_corners_type: "normal"
        border_color: "system"
        alignment: "right"
        direction: "down"
        offset_top: 6
        offset_left: 0
        thumbnail_corner_radius: 18
        thumbnail_size: 112
        max_title_size: 60
        max_artist_size: 20
        show_source: true
        show_volume_slider: true
      media_menu_icons:
        play: "\ue768"
        pause: "\ue769"
        prev_track: "\ue892"
        next_track: "\ue893"
      scrolling_label:
        enabled: false
        update_interval_ms: 33
        style: "left"  # can be "left", "right", "bounce", "bounce-ease"
        separator: " | "
        label_padding: 0
        always_scroll: false
        # Easing curve params: https://www.desmos.com/calculator/j7eamemxzi
        ease_slope: 20
        ease_pos: 0.8
        ease_min: 0.5
  active_window:
    type: "yasb.active_window.ActiveWindowWidget"
    options:
      label: "{win[app_name]}"
      label_alt: "{win[app_name]}  ·  {win[title]}"
      label_no_window: ""
      label_icon: false
      label_icon_size: 0
      max_length: 56
      max_length_ellipsis: "..."
      monitor_exclusive: true
  clock:
    type: "yasb.clock.ClockWidget"
    options:
      tooltip: false
      label: "{%a  %d  %b,  %y     %H:%M:%S}"
      label_alt: "{%A %d %B %Y, %H:%M}"
      #locale: 'en_EN' # Language for date, e.g. fr_FR
      timezones: [] # Looks up time zone info from the registry
      callbacks:
        on_right: "exec cmd.exe /c start ms-clock:"
      calendar:
        blur: true
        round_corners: true
        round_corners_type: "normal"
        border_color: "System"
        alignment: "center"
        direction: "down"
  weather:
    type: "yasb.weather.WeatherWidget"
    options:
      tooltip: false
      label: "<span>{icon}</span> {temp}"
      label_alt: "{location}: Min {min_temp}, Max {max_temp}, Humidity {humidity}"
      api_key: 'f60da6fb103441f094891203260111' # Free key from https://www.weatherapi.com/
      update_interval: 600 # Seconds, minimum 600
      hide_decimal: true
      location: 'India Ghaziabad 201013' # Format: "COUNTRY CITY ZIP_CODE", or just a city
      icons:
        sunnyDay: "\ue30d"
        clearNight: "\ue32b"
        cloudyDay: "\udb81\udd99"
        cloudyNight: "\ue311"
        rainyDay: "\udb81\ude7e"
        rainyNight: "\udb81\ude7e"
        blizzardDay: "\uebaa"
        default: "\uebaa"
  volume:
    type: "yasb.volume.VolumeWidget"
    options:
      label: "{icon}"
      label_alt: "{volume}"
      icons:
        muted: "\ueee8"
        low: "\uf026"
        medium: "\uf027"
        high: "\uf028"
      callbacks:
        on_right: "exec cmd.exe /c start ms-settings:sound"
      audio_menu:
        blur: true
        round_corners: true
        round_corners_type: "normal"
        border_color: "System"
        alignment: "center"
        direction: "down"
  brightness:
    type: "yasb.brightness.BrightnessWidget"
    options:
      label: "<span>{icon}</span>"
      tooltip: true
      brightness_toggle_level: [0, 50, 100]
      auto_light: false
      auto_light_icon: "\udb80\udce1"
      auto_light_night_level: 35
      auto_light_night_start_time: "19:00"
      auto_light_night_end_time: "06:45"
      auto_light_day_level: 75
      brightness_icons: [
        "\udb80\udcde",  # 0-25% brightness
        "\udb80\udcdd",  # 26-50% brightness
        "\udb80\udcdf",  # 51-75% brightness
        "\udb80\udce0"   # 76-100% brightness
      ]
      brightness_menu:
        blur: true
        round_corners: true
        round_corners_type: "normal"
        border_color: "System"
        alignment: "right"
        direction: "down"
      callbacks:
        on_right: "exec cmd.exe /c start ms-settings:system"
  power_menu:
    type: "yasb.power_menu.PowerMenuWidget"
    options:
      label: "\uf011"
      uptime: true
      blur: false
      blur_background: true
      animation_duration: 300 # Milliseconds
      button_row: 3 # Buttons per row, min 1 max 5
      buttons:
        lock: ["\uea75", "Lock"]
        signout: ["\udb80\udf43", "Sign out"]
        shutdown: ["\uf011", "Shut Down"]
        restart: ["\uead2", "Restart"]
        hibernate: ["\uf28e", "Hibernate"]
        cancel: ["\udb81\udf3a", "Cancel"]
  settings:
    type: "yasb.applications.ApplicationsWidget"
    options:
      label: "{data}"
      app_list:
        - {icon: "\ue690", launch: "quick_settings"}
  win_button:
    type: "yasb.custom.CustomWidget"
    options:
      label: "\ue62a"
      label_alt: "\ue62a"
      class_name: "win-button-widget"
      callbacks:
        on_left: "exec start_menu"
  traffic:
    type: "yasb.traffic.TrafficWidget"
    options:
      label: "<span>\udb86\uddb3</span>{download_speed}<span class=\"tr_sep\">\ue621</span><span>\udb86\uddb2</span>{upload_speed}"
      label_alt: "Download {download_speed} \ue621 Upload {upload_speed}"
      update_interval: 1000 # Must be a multiple of 1000
      callbacks:
        on_left: "toggle_label"
        on_right: "exec cmd /c Taskmgr"
  home:
    type: "yasb.home.HomeWidget"
    options:
      label: "\ue8e5"
      menu_list:
        - { title: "Control Panel", path: "C:\\Users\\crazz\\AppData\\Roaming\\Microsoft\\Windows\\Start Menu\\Programs\\System Tools\\Control Panel.lnk" }
        - { title: "User Home", path: "~" }
        - { title: "Download", path: "~\\Downloads" }
        - { title: "Documents", path: "~\\Documents" }
        - { title: "Pictures", path: "~\\Pictures" }
        - { title: "Kernel (C)", path: "C:\\" }
        - { title: "Kioku (D)", path: "D:\\" }
      system_menu: true
      power_menu: true
      blur: true
      border_color: "System"
      round_corners_type: "normal"
  apps:
    type: "yasb.applications.ApplicationsWidget"
    options:
      label: "{data}"
      app_list:
        - {icon: "File", launch: "explorer"}
        - {icon: "Code", launch: "code"}
        - {icon: "Terminal", launch: "wt"}
        - {icon: "Notepad", launch: "notepad"}
        - {icon: "Browser", launch: "C:\\Program Files\\Zen Browser\\zen.exe"}
  battery:
    type: "yasb.battery.BatteryWidget"
    options:
      label: "<span>{icon}</span> {percent}%"
      label_alt: "<span>{icon}</span> {percent}% | {power}W | {time_remaining}"
      update_interval: 1000
      time_remaining_natural: false
      hide_unsupported: true
      charging_options:
        icon_format: "{charging_icon}"
        blink_charging_icon: true
        blink_interval: 500
      status_thresholds:
        critical: 10
        low: 30
        medium: 60
        high: 80
        full: 100
      status_icons:
        icon_charging: "\uf0e7"
        icon_critical: "\uf244"
        icon_low: "\uf243"
        icon_medium: "\uf242"
        icon_high: "\uf241"
        icon_full: "\uf240"
      callbacks:
        on_left: "do_nothing"
        on_middle: "do_nothing"
        on_right: "do_nothing"
  wifi:
    type: "yasb.wifi.WifiWidget"
    options:
      label: "<span>{wifi_icon}</span>"
      label_alt: "{wifi_name} {wifi_strength}%"
      update_interval: 5000
      callbacks:
        on_left: "exec quick_settings"
        on_middle: "do_nothing"
        on_right: "exec cmd.exe /c start ms-settings:network"
      wifi_icons: [
        "\udb82\udd2e",  # 0% strength
        "\udb82\udd1f",  # 1-20% strength
        "\udb82\udd22",  # 21-40% strength
        "\udb82\udd25",  # 41-80% strength
        "\uf1eb"         # 81-100% strength
      ]
  bluetooth:
    type: "yasb.bluetooth.BluetoothWidget"
    options:
      label: "<span>{icon}</span>"
      label_alt: "{device_name}"
      label_no_device: "No devices"
      icons:
        bluetooth_on: "\udb80\udcaf"
        bluetooth_connected: "\udb80\udcb1"
        bluetooth_off: "\uf293"
      callbacks:
        on_left: "exec quick_settings"
        on_middle: "do_nothing"
        on_right: "exec cmd.exe /c start ms-settings:bluetooth"
  systray:
    type: "yasb.systray.SystrayWidget"
    options:
      class_name: "systray"
      label_collapsed: "\udb81\udeb6"
      label_expanded: "\udb82\ude03"
      label_position: "left" # "left" or "right"
      icon_size: 15 # Integer between 8 and 64
      pin_click_modifier: "alt" # "ctrl", "alt" or "shift"
      show_unpinned: false
  notifications:
    type: "yasb.notifications.NotificationsWidget"
    options:
      label: "<span>\udb80\udd78</span>"
      hide_empty: true
      tooltip: false
      callbacks:
        on_left: "toggle_notification"
        on_right: "do_nothing"
        on_middle: "do_nothing"
  quick_launch:
    type: "yasb.quick_launch.QuickLaunchWidget"
    options:
      label: ""
      search_placeholder: "Search applications..."
      max_results: 50
      show_icons: true
      icon_size: 32
      compact_mode: true
      providers:
        apps:
          enabled: true
          prefix: "*"
          priority: 0
          show_recent: false
          max_recent: 5
          show_description: true
        calculator:
          enabled: true
          prefix: " "
          priority: 3
        dev_tools:
          enabled: true
          prefix: "dev"
          priority: 6
        file_search:
          enabled: true
          prefix: ""
          priority: 1
          backend: "auto"
          show_path: true
        settings:
          enabled: true
          prefix: ""
          priority: 2
        web_search:
          enabled: true
          prefix: "?"
          priority: 4
          engine: "google"
      popup:
        width: 720
        height: 420
        blur: true
        round_corners: true
        round_corners_type: "normal"
        border_color: "none"
        dark_mode: true
      callbacks:
        on_left: "toggle_quick_launch"
      keybindings:
        - keys: "alt+space"
          action: "toggle_quick_launch"
